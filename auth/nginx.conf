pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /dev/stdout main;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # The entrypoint validates and renders this operator-supplied ingress CIDR.
    # Only that proxy is allowed to replace the socket peer with X-Forwarded-For.
    set_real_ip_from ${KIDNEYQUANT_TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 512m;
    client_body_timeout 60s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    limit_req_zone $binary_remote_addr zone=page_requests:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=asset_requests:10m rate=50r/s;
    # Shared across every authenticated path so asset-shaped URLs cannot bypass
    # the Basic-auth attempt throttle.
    limit_req_zone $binary_remote_addr zone=auth_attempts:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=decode_connections:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $upstream_forwarded_proto {
        ~*^https$ https;
        default $scheme;
    }

    upstream kidneyquant_web {
        # Use a unique alias: the shared NPM network contains many Compose
        # services named "web", so the generic DNS name is ambiguous.
        server kidneyquant-internal-web:3000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        auth_basic "KidneyQuant";
        auth_basic_user_file /etc/nginx/.htpasswd;
        auth_delay 750ms;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not propagate a client-supplied forwarding chain to the application.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header Cf-Access-Authenticated-User-Email "";
        proxy_set_header X-KidneyQuant-Authenticated-User $remote_user;
        # Always overwrite any client-supplied assertion with the rendered secret.
        proxy_set_header X-KidneyQuant-Proxy-Assertion "${KIDNEYQUANT_PROXY_ASSERTION}";
        # Basic Auth terminates here; never forward the reusable credential.
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;

        # The readiness probe makes a bodyless request through auth -> web. A
        # synthetic user exercises the same assertion gate without exposing app
        # content or requiring the operator's Basic Auth credential.
        location = /health {
            auth_basic off;
            access_log off;
            proxy_method HEAD;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cf-Access-Authenticated-User-Email "";
            proxy_set_header X-KidneyQuant-Authenticated-User readiness-probe;
            proxy_set_header X-KidneyQuant-Proxy-Assertion "${KIDNEYQUANT_PROXY_ASSERTION}";
            proxy_set_header Authorization "";
            proxy_pass http://kidneyquant_web/api/ready;
        }

        # Large decodes are streamed, but each client may hold at most two
        # concurrent decode connections so one user cannot exhaust workers.
        location = /api/decode {
            limit_req zone=auth_attempts burst=15 nodelay;
            limit_req zone=page_requests burst=4 nodelay;
            limit_conn decode_connections 2;
            proxy_pass http://kidneyquant_web;
        }

        # Static/framework requests retain authentication and a generous rate
        # bucket so a normal parallel asset load is not throttled.
        location ~* ^/(?:_next/|assets/|favicon\.ico$|apple-touch-icon|robots\.txt$|sitemap\.xml$|.*\.(?:css|js|mjs|map|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf)$) {
            limit_req zone=auth_attempts burst=15 nodelay;
            limit_req zone=asset_requests burst=100 nodelay;
            proxy_pass http://kidneyquant_web;
        }

        location / {
            limit_req zone=auth_attempts burst=15 nodelay;
            limit_req zone=page_requests burst=10 nodelay;
            proxy_pass http://kidneyquant_web;
        }
    }
}
